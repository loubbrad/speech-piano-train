[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "speech-piano-train"
version = "0"
description = "Continued pretraining experiments on Speech/Piano."
requires-python = ">=3.12"
dependencies = [
    "accelerate==1.14.0",
    "numpy",
    "pydantic",
    "pyyaml",
    "safetensors",
    "torch==2.7.1",
    "tqdm",
    "transformers==5.15.1",
    "wandb",
]

[project.optional-dependencies]
cuda-ext = [
    "causal-conv1d==1.7.0",
    "flash-linear-attention[cuda]==0.5.2",
    "ninja",
    "setuptools",
    "wheel",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
speech-piano-prepare = "speech_piano_train.cli:prepare_main"
speech-piano-train = "speech_piano_train.cli:train_main"
speech-piano-submit = "speech_piano_train.submit:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.setuptools.packages.find]
where = ["."]
include = ["speech_piano_train", "speech_piano_train.*"]

[tool.uv]
no-build-isolation-package = ["causal-conv1d"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
